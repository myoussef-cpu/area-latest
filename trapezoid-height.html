<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقسيم شبه المنحرف بالأضلاع المائلة</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a6b3c">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a href="index.html" class="back-btn">→ الرئيسية</a>
      <h1>تقسيم شبه المنحرف بالأضلاع المائلة</h1>
    </div>
  </header>

  <main class="container">
    <section class="form-section">
      <h2>أدخل أبعاد شبه المنحرف</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>القاعدة العلوية (م)</label>
          <input type="number" id="inputA" placeholder="مثال: 10" step="any" min="0">
        </div>
        <div class="form-group">
          <label>القاعدة السفلية (م)</label>
          <input type="number" id="inputB" placeholder="مثال: 16" step="any" min="0">
        </div>
        <div class="form-group">
          <label>الضلع المائل الأيمن (م)</label>
          <input type="number" id="inputC" placeholder="مثال: 5" step="any" min="0">
        </div>
        <div class="form-group">
          <label>الضلع المائل الأيسر (م)</label>
          <input type="number" id="inputD" placeholder="مثال: 5" step="any" min="0">
        </div>
      </div>
    </section>

    <section class="results-box" id="resultsBox" style="display:none;">
      <h3>النتائج</h3>
      <div class="results-grid" id="resultsGrid"></div>
    </section>

    <section class="canvas-container" id="mainCanvasContainer" style="display:none;">
      <canvas id="mainCanvas"></canvas>
      <div class="zoom-hint">اضغط على الرسم للتكبير</div>
    </section>

    <section class="division-section" id="divisionSection" style="display:none;">
      <h2>خيارات التقسيم بالأضلاع المائلة</h2>
      <p style="color:var(--text-light);margin-bottom:1rem;">أدخل القيم مفصولة بفاصلة.عدد القيم = عدد الأقسام. الأقسام من الأعلى إلى الأسفل.</p>

      <div id="slantInputsContainer">
        <div class="form-grid" style="max-width:600px;">
          <div class="form-group">
            <label>الضلع الأيمن (ci) - مفصولة بفاصلة</label>
            <input type="text" id="ciInput" placeholder="مثال: 5, 4, 3" oninput="onSlantInputChange()">
          </div>
          <div class="form-group">
            <label>الضلع الأيسر (di) - مفصولة بفاصلة</label>
            <input type="text" id="diInput" placeholder="مثال: 5, 4, 3" oninput="onSlantInputChange()">
          </div>
        </div>
        <div id="slantPreview" style="margin:1rem 0;color:var(--text-secondary);font-size:0.95rem;"></div>
        <div id="remainingArea" style="margin:0.5rem 0;padding:0.8rem;background:#fff3e0;border-radius:8px;display:none;"></div>
      </div>

      <button class="btn btn-primary" style="margin-top:1rem;" onclick="calculateDivisions()">حساب الأقسام</button>

      <div id="divisionResults" class="division-results"></div>

      <div class="action-buttons" id="actionBtns" style="display:none;">
        <button class="btn btn-primary" onclick="saveData()">💾 حفظ البيانات</button>
        <button class="btn btn-secondary" onclick="showAllAsImage()">🖼️ عرض الكل كصورة</button>
        <button class="btn btn-outline" onclick="printResults()">🖨️ طباعة</button>
        <button class="btn btn-danger" onclick="clearAll()">🗑️ مسح الكل</button>
      </div>
    </section>

    <section class="canvas-container" id="allSectionsCanvasContainer" style="display:none;">
      <canvas id="allSectionsCanvas"></canvas>
      <div class="zoom-hint">عرض جميع الأقسام معاً</div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="js/calculations.js"></script>
  <script src="js/diagrams.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/export.js"></script>
  <script>
    let lastResult = null;
    let lastDivisions = null;

    ['inputA','inputB','inputC','inputD'].forEach(id => {
      document.getElementById(id).addEventListener('input', autoCalculate);
    });

    function autoCalculate() {
      const a = document.getElementById('inputA').value;
      const b = document.getElementById('inputB').value;
      const c = document.getElementById('inputC').value;
      const d = document.getElementById('inputD').value;

      if (!a || !b || !c || !d) {
        document.getElementById('resultsBox').style.display = 'none';
        document.getElementById('mainCanvasContainer').style.display = 'none';
        document.getElementById('divisionSection').style.display = 'none';
        return;
      }

      const result = Calculations.trapezoidCalc(a, b, c, d);
      if (result.errors) { document.getElementById('resultsBox').style.display = 'none'; return; }

      lastResult = result;
      showResults(result);
      drawMainDiagram(result);
      document.getElementById('divisionSection').style.display = 'block';
      onSlantInputChange();
    }

    function showResults(r) {
      document.getElementById('resultsGrid').innerHTML = `
        <div class="result-item"><div class="label">المساحة الكلية</div><div class="value">${r.areaM2} <span class="unit">م²</span></div></div>
        <div class="result-item"><div class="label">الفدان</div><div class="value">${r.units.feddan} <span class="unit">فدان</span></div></div>
        <div class="result-item"><div class="label">القيراط</div><div class="value">${r.units.qirat} <span class="unit">قيراط</span></div></div>
        <div class="result-item"><div class="label">السهم</div><div class="value">${r.units.sah} <span class="unit">سهم</span></div></div>
        <div class="result-item"><div class="label">الارتفاع</div><div class="value">${r.h} <span class="unit">م</span></div></div>
        <div class="result-item"><div class="label">x1</div><div class="value">${r.x1} <span class="unit">م</span></div></div>
        <div class="result-item"><div class="label">x2</div><div class="value">${r.x2} <span class="unit">م</span></div></div>
        <div class="result-item"><div class="label">القطر الأول</div><div class="value">${r.diag1} <span class="unit">م</span></div></div>
        <div class="result-item"><div class="label">القطر الثاني</div><div class="value">${r.diag2} <span class="unit">م</span></div></div>
        <div class="result-item"><div class="label">المحيط</div><div class="value">${r.perimeter} <span class="unit">م</span></div></div>
      `;
      document.getElementById('resultsBox').style.display = 'block';
    }

    function drawMainDiagram(r) {
      Diagrams.drawTrapezoid(document.getElementById('mainCanvas'), r, null);
      document.getElementById('mainCanvasContainer').style.display = 'block';
    }

    function onSlantInputChange() {
      if (!lastResult) return;
      const ciVals = parseSlantInput('ciInput');
      const diVals = parseSlantInput('diInput');
      const n = Math.max(ciVals.length, diVals.length);
      const preview = document.getElementById('slantPreview');
      const remaining = document.getElementById('remainingArea');

      if (n === 0) { preview.innerHTML = ''; remaining.style.display = 'none'; return; }

      const ciSum = ciVals.reduce((s, v) => s + v, 0);
      const diSum = diVals.reduce((s, v) => s + v, 0);
      const remainingC = lastResult.c - ciSum;
      const remainingD = lastResult.d - diSum;

      preview.innerHTML = `<strong>${n} قسم</strong> - ci: [${ciVals.join(', ')}] - di: [${diVals.join(', ')}]`;
      remaining.style.display = 'block';
      remaining.innerHTML = `
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;">
          <span>المتبقي من الضلع الأيمن (c): <strong style="color:${Math.abs(remainingC) < 0.001 ? 'var(--primary)' : remainingC < 0 ? '#d32f2f' : 'var(--text-primary)'}">${Math.round(remainingC * 1000) / 1000} م</strong></span>
          <span>المتبقي من الضلع الأيسر (d): <strong style="color:${Math.abs(remainingD) < 0.001 ? 'var(--primary)' : remainingD < 0 ? '#d32f2f' : 'var(--text-primary)'}">${Math.round(remainingD * 1000) / 1000} م</strong></span>
        </div>
        <div style="margin-top:0.3rem;font-size:0.85rem;color:#999;">
          ${(ciVals.length !== diVals.length) ? '⚠️ عدد قيم ci وdi غير متساوٍ - سيتم استخدام القيم المتاحة' : (Math.abs(remainingC) < 0.001 && Math.abs(remainingD) < 0.001) ? '✓ تم استخدام كامل الأضلاع' : ''}
        </div>
      `;
    }

    function parseSlantInput(inputId) {
      const val = document.getElementById(inputId).value.trim();
      if (!val) return [];
      return val.split(/[,،\s]+/).map(v => parseFloat(v.trim())).filter(v => !isNaN(v) && v > 0);
    }

    function calculateDivisions() {
      if (!lastResult) return;
      const ciVals = parseSlantInput('ciInput');
      const diVals = parseSlantInput('diInput');
      const n = Math.max(ciVals.length, diVals.length);

      if (n === 0) { showToast('أدخل قيم على الأقل في ci أو di'); return; }

      const slants = [];
      for (let i = 0; i < n; i++) {
        slants.push({
          ci: ciVals[i] || 0,
          di: diVals[i] || 0
        });
      }

      if (slants.length === 0) { showToast('أدخل قسم على الأقل'); return; }

      const result = Calculations.divideBySlantTrapezoid(lastResult.a, lastResult.b, lastResult.c, lastResult.d, slants);
      if (result.errors) { showToast(result.errors[0]); return; }

      lastDivisions = result;
      showDivisionResults(result);
      drawAllSections(result);
      document.getElementById('actionBtns').style.display = 'flex';
    }

    function showDivisionResults(result) {
      const container = document.getElementById('divisionResults');
      let html = `<h3 style="color:var(--primary-dark);margin:1.5rem 0 1rem;">الأقسام (${result.sections.length} قسم)</h3>`;

      result.sections.forEach(sec => {
        html += `
          <div class="division-card">
            <h4>القسم ${sec.index}</h4>
            <canvas id="secCanvas${sec.index}" class="section-canvas"></canvas>
            <div class="zoom-hint">اضغط للتكبير</div>
            <div class="results-grid" style="margin-top:1rem;">
              <div class="result-item"><div class="label">المساحة</div><div class="value">${sec.areaM2} <span class="unit">م²</span></div></div>
              <div class="result-item"><div class="label">بالوحدات</div><div class="value">${sec.units.display}</div></div>
              <div class="result-item"><div class="label">القاعدة العلوية</div><div class="value">${sec.a} <span class="unit">م</span></div></div>
              <div class="result-item"><div class="label">القاعدة السفلية</div><div class="value">${sec.b} <span class="unit">م</span></div></div>
              <div class="result-item"><div class="label">الضلع الأيمن</div><div class="value">${sec.c} <span class="unit">م</span></div></div>
              <div class="result-item"><div class="label">الضلع الأيسر</div><div class="value">${sec.d} <span class="unit">م</span></div></div>
              <div class="result-item"><div class="label">الارتفاع</div><div class="value">${sec.h} <span class="unit">م</span></div></div>
              <div class="result-item"><div class="label">القطر الأول</div><div class="value">${sec.diag1} <span class="unit">م</span></div></div>
              <div class="result-item"><div class="label">القطر الثاني</div><div class="value">${sec.diag2} <span class="unit">م</span></div></div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      result.sections.forEach(sec => {
        Diagrams.drawTrapezoidSection(document.getElementById(`secCanvas${sec.index}`), sec, sec.index, lastResult.h, lastResult.a, lastResult.b);
      });
    }

    function drawAllSections(result) {
      Diagrams.drawTrapezoid(document.getElementById('allSectionsCanvas'), lastResult, result.sections, lastResult.h);
      document.getElementById('allSectionsCanvasContainer').style.display = 'block';
    }

    function saveData() {
      if (!lastResult) return;
      Export.saveFullData({
        title: 'تقسيم شبه المنحرف بالأضلاع المائلة',
        inputs: {
          'القاعدة العلوية': document.getElementById('inputA').value,
          'القاعدة السفلية': document.getElementById('inputB').value,
          'الضلع الأيمن': document.getElementById('inputC').value,
          'الضلع الأيسر': document.getElementById('inputD').value
        },
        results: lastResult,
        sections: lastDivisions ? lastDivisions.sections : null
      });
      Storage.save({ title: 'تقسيم شبه المنحرف بالأضلاع المائلة', pageUrl: 'trapezoid-height.html', inputs: { a: lastResult.a, b: lastResult.b, c: lastResult.c, d: lastResult.d }, result: lastResult, units: lastResult.units });
      showToast('تم حفظ البيانات بنجاح');
    }

    function showAllAsImage() {
      if (!lastResult) return;
      Export.exportFullPage({
        title: 'تقسيم شبه المنحرف بالأضلاع المائلة',
        inputs: {
          'القاعدة العلوية': document.getElementById('inputA').value,
          'القاعدة السفلية': document.getElementById('inputB').value,
          'الضلع الأيمن': document.getElementById('inputC').value,
          'الضلع الأيسر': document.getElementById('inputD').value
        },
        results: lastResult,
        sections: lastDivisions ? lastDivisions.sections : null,
        mainCanvasId: 'mainCanvas',
        sectionCanvasPrefix: 'secCanvas'
      });
      showToast('تم حفظ الصورة');
    }

    function printResults() {
      if (!lastResult) return;
      Export.printFullPage({
        title: 'تقسيم شبه المنحرف بالأضلاع المائلة',
        inputs: {
          'القاعدة العلوية': document.getElementById('inputA').value,
          'القاعدة السفلية': document.getElementById('inputB').value,
          'الضلع الأيمن': document.getElementById('inputC').value,
          'الضلع الأيسر': document.getElementById('inputD').value
        },
        results: lastResult,
        sections: lastDivisions ? lastDivisions.sections : null,
        mainCanvasId: 'mainCanvas',
        sectionCanvasPrefix: 'secCanvas'
      });
    }
    function clearAll() {
      ['inputA','inputB','inputC','inputD'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('resultsBox').style.display = 'none';
      document.getElementById('mainCanvasContainer').style.display = 'none';
      document.getElementById('divisionSection').style.display = 'none';
      document.getElementById('allSectionsCanvasContainer').style.display = 'none';
      document.getElementById('actionBtns').style.display = 'none';
      document.getElementById('divisionResults').innerHTML = '';
      lastResult = null; lastDivisions = null;
    }
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
    document.querySelectorAll('canvas').forEach(c => c.addEventListener('click', () => c.classList.toggle('zoomed')));
  </script>
</body>
</html>
